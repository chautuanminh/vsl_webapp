<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Real-Time Detection</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-video"></i> YOLO Real-Time Object Detection</h1>
            <p>Powered by YOLOv11 & FastAPI</p>
        </header>

        <main>
            <!-- Live Stream Section -->
            <section class="card">
                <div class="card-header">
                    <h2>Live Stream</h2>
                    <div class="controls">
                        <label for="conf-slider">Confidence Threshold: <span id="conf-val">0.25</span></label>
                        <input type="range" id="conf-slider" min="0.01" max="1.0" step="0.01" value="0.25">
                    </div>
                </div>
                <div class="video-container">
                    <img id="video-feed" src="/video_feed" alt="Live Video Feed">
                </div>
            </section>

            <!-- Image Upload Section -->
            <section class="card">
                <div class="card-header">
                    <h2>Image Detection</h2>
                </div>
                <div class="upload-container">
                    <form id="upload-form">
                        <input type="file" id="image-input" accept="image/*" required>
                        <button type="submit" class="btn"><i class="fas fa-upload"></i> Detect</button>
                    </form>
                    <div id="upload-result" class="hidden">
                        <h3>Result:</h3>
                        <p>Avg Confidence: <span id="upload-conf"></span></p>
                        <img id="result-image" src="" alt="Detection Result">
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 YOLO Web App</p>
        </footer>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
